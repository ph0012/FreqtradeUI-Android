# Configurações JVM do daemon do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build em paralelo e cache de configuração/compilação.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX é obrigatório para Jetpack Compose.
android.useAndroidX=true

# Kotlin: estilo de código oficial.
kotlin.code.style=official

# Gera apenas os recursos necessários para reduzir o tamanho do APK.
android.nonTransitiveRClass=true

# Não altere a JVM alvo manualmente aqui; ela é definida no app/build.gradle.kts.
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
